<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Azeel Technologies</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700;900&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:#007AFF;--blue2:#0040cc;--cyan:#00d4ff;--green:#30d158;--dark:#020508;}
html,body{background:var(--dark);color:#fff;font-family:'Montserrat',sans-serif;overflow:hidden;width:100%;height:100%;-webkit-tap-highlight-color:transparent;}

/* CANVAS */
#canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* AMBIENT */
.ambient{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 65% 55% at 50% 50%,rgba(0,122,255,0.09) 0%,transparent 70%);animation:ambS 6s ease-in-out infinite;}
@keyframes ambS{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

/* VIGNETTE */
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 88% 88% at 50% 50%,transparent 50%,rgba(2,5,8,0.75) 100%);}

/* GRAIN */
#grain{position:fixed;inset:0;z-index:900;pointer-events:none;opacity:0.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

/* ══════════════════════════
   HOOK
══════════════════════════ */
#hook{
  position:fixed;inset:0;z-index:400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--dark);
  transition:opacity 1.2s cubic-bezier(0.4,0,0.2,1);
  overflow:hidden;
}
#hook.out{opacity:0;pointer-events:none;}
#hook.gone{display:none;}

/* scanlines */
#hook::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,122,255,0.01) 2px,rgba(0,122,255,0.01) 4px);}
/* sweep */
#hook::after{content:'';position:absolute;left:0;right:0;height:2px;top:-2px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.5),transparent);animation:sweep 3.5s linear infinite;}
@keyframes sweep{0%{top:-2px;}100%{top:100%;}}

.hk-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:0 20px;width:100%;}

/* LOGO — big, centred, visible */
.hk-logo{
  width:min(200px,52vw);
  height:min(200px,52vw);
  border-radius: 20%;
  object-fit:contain;
  opacity:0;
  transform:scale(0.4) translateY(24px);
  animation:logoBlast 1.1s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
  filter:drop-shadow(0 0 40px rgba(0,122,255,0.7)) drop-shadow(0 0 80px rgba(0,212,255,0.3));
  display:block;
}
@keyframes logoBlast{
  0%{opacity:0;transform:scale(0.4) translateY(24px);}
  65%{opacity:1;transform:scale(1.06) translateY(-4px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

/* BRAND NAME */
.hk-brand{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(36px,11vw,64px);
  letter-spacing:clamp(4px,2vw,10px);
  line-height:1;
  margin-top:clamp(14px,3.5vw,22px);
  opacity:0;
  transform:translateY(22px) scaleX(0.85);
  animation:brandUp 0.9s cubic-bezier(0.22,1,0.36,1) 1.1s forwards;
  text-align:center;
}
.hk-brand .w1{
  display:block;
  color:rgba(255,255,255,0.92);
  text-shadow:0 0 40px rgba(255,255,255,0.15);
}
.hk-brand .w2{
  display:block;
  color:var(--blue);
  text-shadow:0 0 30px rgba(0,122,255,0.85),0 0 70px rgba(0,122,255,0.4);
}
@keyframes brandUp{to{opacity:1;transform:translateY(0) scaleX(1);}}

/* TAGLINE */
.hk-tagline{
  font-size:clamp(10px,2.8vw,13px);
  font-weight:400;
  font-style:italic;
  letter-spacing:clamp(1.5px,0.8vw,3px);
  color:rgba(255,255,255,0.48);
  margin-top:clamp(8px,2vw,12px);
  text-align:center;
  opacity:0;
  transform:translateY(12px);
  animation:fadeUp 0.7s ease 1.9s forwards;
}
.hk-tagline em{font-style:normal;color:var(--cyan);font-weight:600;}

/* DIVIDER */
.hk-div{
  width:0;height:1px;
  margin-top:clamp(14px,3.5vw,22px);
  background:linear-gradient(90deg,transparent,var(--cyan),var(--blue),var(--cyan),transparent);
  box-shadow:0 0 10px rgba(0,212,255,0.6);
  animation:divGrow 0.9s cubic-bezier(0.22,1,0.36,1) 2.5s forwards;
}
@keyframes divGrow{to{width:clamp(130px,36vw,220px);}}

/* CHIPS */
.hk-chips{
  display:flex;gap:clamp(5px,1.5vw,8px);flex-wrap:wrap;justify-content:center;
  margin-top:clamp(14px,3vw,20px);max-width:min(420px,90vw);
  opacity:0;animation:fadeUp 0.7s ease 3s forwards;
}
.hk-chip{
  font-size:clamp(7px,1.8vw,8.5px);letter-spacing:1.2px;text-transform:uppercase;
  padding:clamp(4px,1vw,5px) clamp(9px,2.5vw,13px);
  border:0.5px solid rgba(0,122,255,0.38);border-radius:20px;
  color:rgba(255,255,255,0.42);background:rgba(0,122,255,0.07);
}

/* LOADING BAR */
.hk-loader{
  margin-top:clamp(18px,4.5vw,28px);
  display:flex;align-items:center;gap:10px;
  opacity:0;animation:fadeUp 0.6s ease 3.4s forwards;
}
.hk-loader span{font-size:clamp(7.5px,2vw,9px);letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.2);}
.hk-bar-track{width:clamp(90px,25vw,140px);height:2px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
.hk-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:2px;animation:barFill 3.5s linear 3.5s forwards;}
@keyframes barFill{to{width:100%;}}

@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

/* ══════════════════════════
   SCENE / PHONE
══════════════════════════ */
#scene{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:center;padding:clamp(6px,1.5vh,14px);perspective:1200px;}

.phone{
  width:min(348px,calc(100vw - 12px));
  height:min(700px,calc(100dvh - 12px));
  background:linear-gradient(170deg,#0c1830 0%,#050c18 60%,#030810 100%);
  border-radius:clamp(36px,9vw,52px);
  box-shadow:0 0 0 1.5px rgba(255,255,255,0.07),0 0 0 clamp(7px,2vw,11px) #07101e,0 0 0 clamp(8.5px,2.3vw,12.5px) rgba(255,255,255,0.03),0 60px 140px rgba(0,0,0,0.97),0 0 80px rgba(0,80,255,0.07),inset 0 1px 0 rgba(255,255,255,0.06);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  opacity:0;
  transform:translateY(80px) scale(0.82) rotateX(8deg);
  transition:transform 1.4s cubic-bezier(0.22,1,0.36,1),opacity 1.4s ease;
  transform-style:preserve-3d;will-change:transform,opacity;
}
.phone.show{opacity:1;transform:translateY(0) scale(1) rotateX(0deg);}
.phone::before{content:'';position:absolute;top:0;left:-20%;width:55%;height:45%;background:linear-gradient(135deg,rgba(255,255,255,0.035) 0%,transparent 60%);border-radius:inherit;z-index:0;pointer-events:none;transform:skewX(-8deg);}

/* island */
.island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:clamp(88px,26vw,112px);height:clamp(26px,4vw,30px);background:#000;border-radius:20px;z-index:40;display:flex;align-items:center;justify-content:space-evenly;padding:0 13px;box-shadow:0 3px 12px rgba(0,0,0,0.9);flex-shrink:0;}
.i-dot{width:8px;height:8px;border-radius:50%;background:#181818;}
.i-cam{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1a1a2e,#090912);border:1.5px solid #1d1d2e;box-shadow:0 0 4px rgba(0,122,255,0.2);}

/* status bar */
.sbar{padding:clamp(46px,6.5vh,62px) clamp(18px,4.5vw,24px) 0;display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,2.8vw,13px);font-weight:700;position:relative;z-index:5;color:rgba(255,255,255,0.9);flex-shrink:0;}
.sbar-r{display:flex;gap:6px;align-items:center;}

/* chat header */
.chead{
  padding:clamp(8px,2vh,12px) clamp(14px,3.8vw,20px);
  display:flex;align-items:center;gap:clamp(10px,2.8vw,14px);
  border-bottom:0.5px solid rgba(255,255,255,0.05);
  position:relative;z-index:5;flex-shrink:0;
  background:rgba(5,9,20,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.av-wrap{position:relative;flex-shrink:0;}
.av-ring{width:clamp(38px,10vw,46px);height:clamp(38px,10vw,46px);border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--cyan),var(--blue));padding:2px;animation:spinR 6s linear infinite;}
@keyframes spinR{to{transform:rotate(360deg);}}
.av-inner{width:100%;height:100%;border-radius:50%;background:#060d1a;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.av-inner img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.av-pulse{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(0,122,255,0.22);animation:avpulse 2.8s ease-in-out infinite;pointer-events:none;}
@keyframes avpulse{0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.2);opacity:0;}}
.od{position:absolute;bottom:1px;right:1px;width:clamp(8px,2.2vw,10px);height:clamp(8px,2.2vw,10px);border-radius:50%;background:var(--green);border:1.5px solid #06090e;box-shadow:0 0 8px rgba(48,209,88,0.9);animation:odg 1.8s ease-in-out infinite;}
@keyframes odg{0%,100%{box-shadow:0 0 5px rgba(48,209,88,0.6);}50%{box-shadow:0 0 14px rgba(48,209,88,1),0 0 22px rgba(48,209,88,0.4);}}
.cname{font-size:clamp(13px,3.4vw,15px);font-weight:800;color:#fff;}
.ctag{font-size:clamp(8px,2.1vw,9.5px);color:var(--green);font-weight:600;letter-spacing:0.8px;text-transform:uppercase;margin-top:1px;}
.hd-r{margin-left:auto;flex-shrink:0;}
.vbadge{width:clamp(22px,5.5vw,26px);height:clamp(22px,5.5vw,26px);border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,122,255,0.5);}

/* chat area */
.carea{flex:1;overflow-y:auto;overflow-x:hidden;padding:clamp(10px,2.5vw,16px) clamp(12px,3.2vw,16px) clamp(6px,1.5vw,10px);display:flex;flex-direction:column;gap:clamp(7px,2vw,11px);position:relative;z-index:5;scroll-behavior:smooth;scrollbar-width:none;}
.carea::-webkit-scrollbar{display:none;}
.carea{mask-image:linear-gradient(to bottom,transparent 0%,#000 6%,#000 92%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 6%,#000 92%,transparent 100%);}

/* date divider */
.date-div{align-self:center;font-size:clamp(7.5px,1.9vw,9px);color:rgba(255,255,255,0.22);letter-spacing:1.5px;text-transform:uppercase;padding:3px 12px;border-radius:20px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.07);flex-shrink:0;opacity:0;transform:scale(0.88) translateY(6px);transition:opacity 0.5s ease,transform 0.5s cubic-bezier(0.34,1.56,0.64,1);}
.date-div.vis{opacity:1;transform:scale(1) translateY(0);}

/* messages */
.msg{display:flex;flex-shrink:0;opacity:0;max-width:88%;transition:opacity 1.5s ease,transform 0.48s cubic-bezier(0.34,1.56,0.64,1);}
.msg.recv{align-self:flex-start;transform:translateX(-18px) scale(0.93);}
.msg.sent{align-self:flex-end;transform:translateX(18px) scale(0.93);}
.msg.svc{align-self:flex-end;max-width:94%;transform:translateY(16px) scale(0.93);}
.msg.vis{opacity:1;transform:translateX(0) translateY(0) scale(1);}

/* bubbles */
.bubble{padding:clamp(8px,2.2vw,11px) clamp(12px,3.2vw,15px);border-radius:20px;font-size:clamp(11px,2.8vw,12.5px);line-height:1.6;word-break:break-word;position:relative;}
.recv .bubble{background:rgba(255,255,255,0.062);color:rgba(255,255,255,0.88);border-bottom-left-radius:4px;border:0.5px solid rgba(255,255,255,0.08);backdrop-filter:blur(12px);}
.sent .bubble{background:linear-gradient(145deg,#1e85ff 0%,#0048d9 100%);color:#fff;border-bottom-right-radius:4px;box-shadow:0 6px 24px rgba(0,90,255,0.42),inset 0 1px 0 rgba(255,255,255,0.18);}
.tick{font-size:8px;color:rgba(255,255,255,0.5);letter-spacing:-1px;margin-left:5px;vertical-align:middle;}

/* service card */
.svc .bubble{padding:0;overflow:hidden;min-width:clamp(210px,58vw,270px);background:rgba(7,12,28,0.92);border:1px solid rgba(0,122,255,0.2);border-radius:18px;border-bottom-right-radius:4px;box-shadow:0 8px 36px rgba(0,80,255,0.2),inset 0 1px 0 rgba(255,255,255,0.04);backdrop-filter:blur(16px);}
.sc-head{padding:clamp(9px,2.4vw,12px) clamp(11px,3vw,15px);display:flex;align-items:center;gap:clamp(9px,2.4vw,12px);border-bottom:0.5px solid rgba(0,122,255,0.12);position:relative;overflow:hidden;}
.sc-head::after{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.045),transparent);animation:shim 3.8s ease infinite;}
@keyframes shim{0%{left:-100%;}55%,100%{left:150%;}}
.sc-icon{width:clamp(32px,8.5vw,38px);height:clamp(32px,8.5vw,38px);border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,4vw,18px);position:relative;z-index:1;}
.sc-name{font-size:clamp(11.5px,3vw,13px);font-weight:800;color:#fff;position:relative;z-index:1;}
.sc-badge{margin-left:auto;font-size:clamp(6.5px,1.7vw,7.5px);letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px;flex-shrink:0;position:relative;z-index:1;font-weight:700;}
.sc-desc{padding:clamp(7px,2vw,10px) clamp(11px,3vw,15px);font-size:clamp(9.5px,2.4vw,11px);color:rgba(255,255,255,0.5);line-height:1.55;border-bottom:0.5px solid rgba(255,255,255,0.04);}
.sc-tags{display:flex;gap:4px;flex-wrap:wrap;padding:clamp(6px,1.8vw,8px) clamp(11px,3vw,15px);}
.stag{font-size:clamp(6.5px,1.6vw,7.5px);letter-spacing:0.8px;text-transform:uppercase;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.35);}

/* typing */
.typing{display:flex;align-self:flex-start;flex-shrink:0;opacity:0;transform:translateX(-16px) scale(0.9);transition:opacity 0.32s,transform 0.38s cubic-bezier(0.34,1.56,0.64,1);}
.typing.vis{opacity:1;transform:translateX(0) scale(1);}
.typing-bub{background:rgba(255,255,255,0.062);border:0.5px solid rgba(255,255,255,0.08);border-radius:20px;border-bottom-left-radius:4px;padding:clamp(9px,2.4vw,12px) clamp(13px,3.4vw,16px);display:flex;gap:5px;align-items:center;backdrop-filter:blur(12px);}
.dot{width:clamp(5px,1.4vw,7px);height:clamp(5px,1.4vw,7px);background:rgba(255,255,255,0.3);border-radius:50%;animation:blink 2.5s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.25s;}.dot:nth-child(3){animation-delay:.5s;}
@keyframes blink{0%,60%,100%{transform:translateY(0) scale(1);opacity:.22;}30%{transform:translateY(-5px) scale(1.1);opacity:1;}}

/* input bar */
.ibar{padding:clamp(7px,2vw,9px) clamp(13px,3.5vw,17px) clamp(20px,5vw,30px);display:flex;align-items:center;gap:clamp(7px,2vw,9px);border-top:0.5px solid rgba(255,255,255,0.04);position:relative;z-index:5;flex-shrink:0;background:rgba(3,7,16,0.85);backdrop-filter:blur(20px);}
.ipill{flex:1;border-radius:24px;background:rgba(255,255,255,0.042);border:0.5px solid rgba(255,255,255,0.07);padding:clamp(8px,2.2vw,10px) clamp(13px,3.5vw,16px);font-size:clamp(10px,2.5vw,11.5px);color:rgba(255,255,255,0.18);font-family:'Montserrat',sans-serif;}
.ibtn{width:clamp(30px,7.5vw,34px);height:clamp(30px,7.5vw,34px);border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#1e80ff,#0040cc);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,100,255,0.55);}
.ibtn svg{width:clamp(12px,3vw,14px);height:clamp(12px,3vw,14px);fill:#fff;}

/* replay */
#replay{position:fixed;bottom:clamp(16px,4vh,28px);left:50%;transform:translateX(-50%);z-index:800;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55);padding:clamp(9px,2.4vw,12px) clamp(24px,6.5vw,36px);border-radius:30px;font-size:clamp(9px,2.3vw,11px);font-family:'Montserrat',sans-serif;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(14px);transition:all 0.28s;opacity:0;pointer-events:none;white-space:nowrap;}
#replay.show{opacity:1;pointer-events:all;animation:rPop 0.7s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes rPop{from{transform:translateX(-50%) translateY(22px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
#replay:hover{background:rgba(0,100,255,0.18);color:#fff;border-color:rgba(0,122,255,0.5);}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ambient"></div>
<div id="vig"></div>
<div id="grain"></div>

<!-- HOOK -->
<div id="hook">
  <div class="hk-wrap">
    <img class="hk-logo" id="hkLogo" src="" alt="Azeel Technologies">
    <div class="hk-brand">
      <span class="w1">AZEEL</span>
      <span class="w2">TECHNOLOGIES</span>
    </div>
    <div class="hk-tagline">"Turning ideas into <em>digital reality."</em></div>
    <div class="hk-div"></div>
    <div class="hk-chips">
      <span class="hk-chip">🌐 Web Dev</span>
      <span class="hk-chip">📱 Apps</span>
      <span class="hk-chip">🔍 SEO</span>
      <span class="hk-chip">🎯 Meta &amp; Google Ads</span>
      <span class="hk-chip">📲 Social Media</span>
      <span class="hk-chip">✍️ Content Creation</span>
      <span class="hk-chip">📣 Digital Marketing</span>
    </div>
    <div class="hk-loader">
      <span>Loading</span>
      <div class="hk-bar-track"><div class="hk-bar-fill"></div></div>
    </div>
  </div>
</div>

<!-- PHONE -->
<div id="scene">
<div class="phone" id="phone">
  <div class="island"><div class="i-dot"></div><div class="i-cam"></div></div>

  <div class="sbar">
    <span>9:41</span>
    <div class="sbar-r">

/* PARTICLES */
(()=>{
  const cv=document.getElementById('canvas'),cx=cv.getContext('2d');
  let W,H;
  const pts=Array.from({length:60},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.2+0.3,
    vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,
    ph:Math.random()*Math.PI*2,hue:Math.random()<0.75?210:188
  }));
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);
  function draw(){
    cx.clearRect(0,0,W,H);
    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      p.x+=p.vx;p.y+=p.vy;p.ph+=0.007;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=`hsla(${p.hue},100%,62%,${0.09+0.07*Math.sin(p.ph)})`;cx.fill();
      for(let j=i+1;j<pts.length;j++){
        const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<110){cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.strokeStyle=`rgba(0,122,255,${0.04*(1-d/110)})`;cx.lineWidth=0.5;cx.stroke();}
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* TIMERS */
let T=[];
function w(ms){return new Promise(r=>{const t=setTimeout(r,ms);T.push(t);});}
function killT(){T.forEach(clearTimeout);T=[];}

/* SCROLL */
function scr(a){setTimeout(()=>a.scrollTop=a.scrollHeight,65);setTimeout(()=>a.scrollTop=a.scrollHeight,220);}

/* TYPING */
function showTyping(a){
  const el=document.createElement('div');el.className='typing';
  el.innerHTML='<div class="typing-bub"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  a.appendChild(el);scr(a);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('vis')));
  return el;
}
function hideTyping(el){
  if(!el||!el.parentNode)return;
  el.classList.remove('vis');
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},350);
}

/* ADD MESSAGE */
function addMsg(a,m){
  const wrap=document.createElement('div');
  if(m.t==='svc'){
    wrap.className='msg svc';
    wrap.innerHTML=`<div class="bubble">
      <div class="sc-head" style="background:${m.grad};">
        <div class="sc-icon" style="background:${m.ibg};border:1px solid ${m.ib};">${m.icon}</div>
        <div class="sc-name">${m.name}</div>
        <div class="sc-badge" style="background:${m.bc};border:0.5px solid ${m.ib};color:${m.bt};">${m.badge}</div>
      </div>
      <div class="sc-desc">${m.desc}</div>
      <div class="sc-tags">${m.tags.map(t=>`<span class="stag">${t}</span>`).join('')}</div>
    </div>`;
  } else if(m.t==='sent'){
    wrap.className='msg sent';
    wrap.innerHTML=`<div class="bubble">${(m.text||'').replace(/\n/g,'<br>')}<span class="tick">✓✓</span></div>`;
  } else {
    wrap.className=`msg ${m.t}`;
    wrap.innerHTML=`<div class="bubble">${(m.text||'').replace(/\n/g,'<br>')}</div>`;
  }
  a.appendChild(wrap);scr(a);
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add('vis')));
}

function addDate(a,l){
  const d=document.createElement('div');d.className='date-div';d.textContent=l;a.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('vis')));
}

/* RUN CHAT */
async function runChat(){
  const a=document.getElementById('chatArea');a.innerHTML='';
  for(let i=0;i<C.length;i++){
    const m=C[i];
    if(m.t==='date'){await w(300);addDate(a,m.label);await w(500);continue;}
    if(m.t==='recv'){
      const ty=showTyping(a);
      const dur=Math.min((m.text||'').length*28+500,2200);
      await w(dur);hideTyping(ty);await w(160);
      addMsg(a,m);await w(700);
    } else if(m.t==='svc'){
      await w(420);addMsg(a,m);await w(180);
    } else {
      await w(340);addMsg(a,m);await w(640);
    }
  }
  await w(800);
  document.getElementById('replay').classList.add('show');
}

/* SEQUENCE */
async function start(){
  /* Hook runs for 5s so all animations play + loading bar completes */
  await w(5000);
  const h=document.getElementById('hook');
  h.classList.add('out');
  await w(1300);
  h.classList.add('gone');
  document.getElementById('phone').classList.add('show');
  await w(1200);
  runChat();
}

function restartAll(){
  killT();
  const a=document.getElementById('chatArea');if(a)a.innerHTML='';
  document.getElementById('replay').classList.remove('show');
  document.getElementById('phone').classList.remove('show');
  const h=document.getElementById('hook');
  h.classList.remove('out','gone');h.style.opacity='';
  void h.offsetWidth;
  setTimeout(start,80);
}

start();
